---
name: AstroNvim
on:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
    types: [opened, edited, synchronize]
  release:
    types: [published]
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 8 * * 1"

jobs:
  CI:
    uses: AstroNvim/.github/.github/workflows/plugin_ci.yml@cf41eb9
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    with:
      plugin_name: ${{ github.event.repository.name }}
      is_production: false
      docs: false

  Tests:
    uses: ./.github/workflows/neovim_testing.yml
    if: >-
      ${{ github.event_name == 'push'
          || github.event_name == 'pull_request'
          || github.event_name == 'schedule' }}
    permissions:
      contents: read
    with:
      minimum_neovim: "0.12.0"
      visual_neovim: "0.12.4"
      nightly_neovim: "nightly"
      timeout_minutes: 30

  Release:
    needs: Tests
    uses: AstroNvim/.github/.github/workflows/plugin_ci.yml@cf41eb9
    if: ${{ github.event_name == 'push' }}
    concurrency:
      group: ${{ github.event.repository.name }}-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    with:
      plugin_name: ${{ github.event.repository.name }}
      is_production: true
      docs: false

  PR:
    uses: AstroNvim/.github/.github/workflows/validate_pr.yml@cf41eb9
    if: ${{ github.event_name == 'pull_request_target' }}
    permissions:
      pull-requests: read

  Announcement:
    uses: AstroNvim/.github/.github/workflows/discord_announcement.yml@cf41eb9
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: read
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
